name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run audit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Validate skill package
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          for path in sorted(Path(".").glob("*/SKILL.md")):
              text = path.read_text(encoding="utf-8")
              match = re.match(r"^---\n(.*?)\n---\n", text, re.DOTALL)
              if match is None:
                  raise SystemExit(f"{path}: missing YAML frontmatter")
              fields = {
                  line.split(":", 1)[0].strip()
                  for line in match.group(1).splitlines()
                  if ":" in line
              }
              if fields != {"name", "description"}:
                  raise SystemExit(f"{path}: unexpected frontmatter fields: {fields}")
              if f"name: {path.parent.name}" not in match.group(0):
                  raise SystemExit(f"{path}: skill name does not match directory")
              if len(text.splitlines()) > 500:
                  raise SystemExit(f"{path}: exceeds 500 lines")
          PY
